name: Release

on:
  push:
    tags:
      - 'v*'

# Publishing authenticates with npm over OIDC (trusted publishing), configured against this
# repository and this workflow filename in the package settings on npmjs.com. NPM_TOKEN is
# kept as a fallback until an OIDC publish has been seen to work, then it can be revoked.
permissions:
  contents: write
  # Required both for OIDC authentication and for provenance, which links the published
  # tarball back to this workflow run.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which is what trusted publishing needs. The package itself
          # still supports Node 20; this is only the machine doing the publishing.
          node-version: 24
          # No dependency cache in a release build: what gets published should come from a
          # clean resolve of the lockfile, not from whatever a previous run left behind.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      - name: Lint, typecheck and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      # Publishing over OIDC fails with a bare 404 when either side is misconfigured, which
      # is impossible to read. This separates the two sides before we get there: if the job
      # has no id-token the fault is here, and if it does, a later 404 is the npm side.
      - name: Check the publishing environment
        run: |
          echo "npm $(npm --version) on node $(node --version)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "No OIDC id-token in this job. The workflow is missing id-token: write." >&2
            exit 1
          fi
          echo "OIDC id-token is available to this job."

      # We install with pnpm but publish with npm, because trusted publishing and provenance
      # are implemented in the npm CLI and this is the path npm supports directly.
      #
      # npm tries OIDC first and only falls back to NODE_AUTH_TOKEN when the trusted publisher
      # does not answer, so the token here is a fallback rather than the intended path. Once a
      # release is seen to authenticate over OIDC, delete the NPM_TOKEN secret and this `env`
      # block; nothing else has to change. `--provenance` is explicit because the token path
      # does not generate attestations on its own, and it is harmless when OIDC wins.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
